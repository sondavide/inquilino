spring:
  application:
    name: inquilino-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/inquilino
    username: ${DB_USERNAME:inquilino}
    password: ${DB_PASSWORD:inquilino}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

  mail:
    host:     ${MAIL_HOST:smtp.gmail.com}
    port:     ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:inquilino-docs}
  listings-bucket: ${MINIO_LISTINGS_BUCKET:inquilino-listings}

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-at-least-32chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  superadmin:
    email:    ${SUPERADMIN_EMAIL:admin@inquilino.it}
    password: ${SUPERADMIN_PASSWORD:ChangeMe123!}

  mail:
    enabled:  ${MAIL_ENABLED:false}
    host:     ${MAIL_HOST:smtp.gmail.com}
    port:     ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from:     ${MAIL_FROM:noreply@inquilino.it}

  vapid:
    enabled:     ${VAPID_ENABLED:false}
    public-key:  ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject:     ${VAPID_SUBJECT:mailto:admin@inquilino.it}

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
