services:

  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: inquilino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inquilino
      POSTGRES_USER: ${DB_USERNAME:-inquilino}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inquilino}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-inquilino} -d inquilino"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: inquilino-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crea i bucket al primo avvio se non esistono
  minio-init:
    image: minio/mc:latest
    container_name: inquilino-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-inquilino-docs};
      mc anonymous set none local/${MINIO_BUCKET:-inquilino-docs};
      mc mb --ignore-existing local/${MINIO_LISTINGS_BUCKET:-inquilino-listings};
      mc anonymous set download local/${MINIO_LISTINGS_BUCKET:-inquilino-listings};
      echo 'MinIO buckets ready.';
      "
    restart: no

  adminer:
    image: adminer:latest
    container_name: inquilino-adminer
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
