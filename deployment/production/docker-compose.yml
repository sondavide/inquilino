services:

  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: inquilino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       inquilino
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Bind mount → copy/paste backup is a simple folder copy
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d inquilino"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app_net]

  # ── Object storage ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: inquilino-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:       ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD:   ${MINIO_SECRET_KEY}
      # SSE-S3 master key — format: <key-name>:<base64-32-byte-key>
      # Generate with: echo "docs-key:$(openssl rand -base64 32)"
      MINIO_KMS_SECRET_KEY:  ${MINIO_KMS_SECRET_KEY}
    volumes:
      # Bind mount → copy/paste backup is a simple folder copy
      - ./data/minio:/data
    ports:
      # Console accessible only via SSH tunnel: ssh -L 9001:localhost:9001 ubuntu@<IP>
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app_net]

  # Initialises MinIO buckets on first boot
  minio-init:
    image: minio/mc:latest
    container_name: inquilino-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      mc mb --ignore-existing local/${MINIO_BUCKET};
      mc anonymous set none local/${MINIO_BUCKET};
      mc encrypt set sse-s3 local/${MINIO_BUCKET};
      mc mb --ignore-existing local/${MINIO_LISTINGS_BUCKET};
      mc anonymous set download local/${MINIO_LISTINGS_BUCKET};
      echo 'MinIO buckets ready.';
      "
    restart: no
    networks: [app_net]

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/sondavide/inquilino-backend:${BACKEND_TAG:-latest}
    container_name: inquilino-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Override datasource URL to use Docker service name
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/inquilino
      DB_USERNAME:                ${DB_USERNAME}
      DB_PASSWORD:                ${DB_PASSWORD}

      MINIO_ENDPOINT:             http://minio:9000
      MINIO_ACCESS_KEY:           ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY:           ${MINIO_SECRET_KEY}
      MINIO_BUCKET:               ${MINIO_BUCKET}
      MINIO_LISTINGS_BUCKET:      ${MINIO_LISTINGS_BUCKET}

      OPENAI_API_KEY:             ${OPENAI_API_KEY}

      JWT_SECRET:                 ${JWT_SECRET}
      JWT_EXPIRATION_MS:          ${JWT_EXPIRATION_MS:-86400000}

      # CORS: same-origin in prod, dev origins as fallback
      APP_CORS_ALLOWED_ORIGINS:   ${APP_CORS_ALLOWED_ORIGINS:-https://inquilinofacile.it,https://www.inquilinofacile.it}

      # Frontend URL used by OAuth2 redirect
      FRONTEND_URL:               ${FRONTEND_URL:-https://inquilinofacile.it}

      SUPERADMIN_EMAIL:           ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD:        ${SUPERADMIN_PASSWORD}

      # OAuth2 — activate the "oauth" Spring profile when credentials are provided
      SPRING_PROFILES_ACTIVE:     ${SPRING_PROFILES_ACTIVE:-oauth}
      GOOGLE_CLIENT_ID:           ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET:       ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID:         ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET:     ${FACEBOOK_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID:         ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET:     ${LINKEDIN_CLIENT_SECRET:-}

      # Mail (optional)
      MAIL_ENABLED:               ${MAIL_ENABLED:-false}
      MAIL_HOST:                  ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT:                  ${MAIL_PORT:-587}
      MAIL_USERNAME:              ${MAIL_USERNAME:-}
      MAIL_PASSWORD:              ${MAIL_PASSWORD:-}
      MAIL_FROM:                  ${MAIL_FROM:-noreply@inquilinofacile.it}

      # Web Push (optional)
      VAPID_ENABLED:              ${VAPID_ENABLED:-false}
      VAPID_PUBLIC_KEY:           ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY:          ${VAPID_PRIVATE_KEY:-}
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/sondavide/inquilino-frontend:${FRONTEND_TAG:-latest}
    container_name: inquilino-frontend
    restart: unless-stopped
    networks: [app_net]

  # ── Nginx reverse proxy + SSL ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: inquilino-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    # Auto-reload nginx every 6h to pick up renewed certs
    command: >
      /bin/sh -c
      "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    networks: [app_net]

  # ── Certbot (auto-renews every 12h) ──────────────────────────────────────────
  # Uses `command` (not `entrypoint`) so that `docker compose run --rm certbot certonly ...`
  # correctly overrides the command and uses the default certbot entrypoint.
  certbot:
    image: certbot/certbot
    container_name: inquilino-certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    networks: [app_net]
    # Loop: check renewal every 12h
    command: >
      /bin/sh -c
      "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

  # ── Adminer (DB admin, SSH tunnel only) ───────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: inquilino-adminer
    restart: unless-stopped
    ports:
      # Only accessible via SSH tunnel: ssh -L 8888:localhost:8888 ubuntu@<IP>
      - "127.0.0.1:8888:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app_net]

  # ── Monitoring ───────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: inquilino-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks: [app_net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: inquilino-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [app_net]

  node_exporter:
    image: prom/node-exporter:latest
    container_name: inquilino-node-exporter
    restart: unless-stopped
    pid: host
    networks: [app_net]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'

  loki:
    image: grafana/loki:3.4.1
    container_name: inquilino-loki
    restart: unless-stopped
    command: -config.file=/mnt/config/loki-config.yaml
    volumes:
      - ./monitoring/loki:/mnt/config
      - loki_data:/loki
    networks: [app_net]

  promtail:
    image: grafana/promtail:3.4.1
    container_name: inquilino-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail:/mnt/config
      - ./monitoring/promtail/positions:/tmp
    command: -config.file=/mnt/config/promtail-config.yaml
    networks: [app_net]

  grafana:
    image: grafana/grafana:10.2.0
    container_name: inquilino-grafana
    restart: unless-stopped
    user: "0"
    ports:
      # Accessible only via SSH tunnel: ssh -L 3000:localhost:3000 ubuntu@<IP>
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    env_file:
      - ./monitoring/grafana/config.env
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SMTP_PASSWORD:           ${GRAFANA_SMTP_PASSWORD}
    networks: [app_net]

networks:
  app_net:
    driver: bridge

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
