# ── HTTP: redirect to HTTPS + Let's Encrypt challenge ─────────────────────────
server {
    listen 80;
    server_name inquilinofacile.it www.inquilinofacile.it;

    # ACME challenge served from certbot webroot volume
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name inquilinofacile.it www.inquilinofacile.it;

    ssl_certificate     /etc/letsencrypt/live/inquilinofacile.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inquilinofacile.it/privkey.pem;

    # SSL parameters embedded directly — no external file dependencies
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Max upload size (documents, images)
    client_max_body_size 25M;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header Referrer-Policy           "strict-origin"    always;

    # ── Frontend SPA: assets con hash → cache 1 anno (immutabili) ────────────
    location /assets/ {
        proxy_pass         http://frontend:80/assets/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires            1y;
        add_header         Cache-Control             "public, immutable"  always;
        add_header         Strict-Transport-Security "max-age=63072000"   always;
        add_header         X-Frame-Options           "SAMEORIGIN"         always;
        add_header         X-Content-Type-Options    "nosniff"            always;
        add_header         Referrer-Policy           "strict-origin"      always;
    }

    # ── Frontend SPA: index.html e tutto il resto → no cache ─────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires            -1;
        add_header         Cache-Control             "no-cache, no-store, must-revalidate" always;
        add_header         Pragma                    "no-cache"           always;
        add_header         Strict-Transport-Security "max-age=63072000"   always;
        add_header         X-Frame-Options           "SAMEORIGIN"         always;
        add_header         X-Content-Type-Options    "nosniff"            always;
        add_header         Referrer-Policy           "strict-origin"      always;
    }

    # ── Backend REST API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── OAuth2 authorization redirect ─────────────────────────────────────────
    location /oauth2/ {
        proxy_pass         http://backend:8080/oauth2/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── OAuth2 callback ───────────────────────────────────────────────────────
    location /login/oauth2/ {
        proxy_pass         http://backend:8080/login/oauth2/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── MinIO S3 (strip /minio prefix) ────────────────────────────────────────
    location /minio/ {
        proxy_pass         http://minio:9000/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        client_max_body_size 25M;
    }
}
