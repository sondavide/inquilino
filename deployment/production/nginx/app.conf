# ── HTTP: redirect to HTTPS + Let's Encrypt challenge ─────────────────────────
server {
    listen 80;
    server_name inquilinofacile.it www.inquilinofacile.it;

    # ACME challenge served from certbot webroot volume
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name inquilinofacile.it www.inquilinofacile.it;

    ssl_certificate     /etc/letsencrypt/live/inquilinofacile.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inquilinofacile.it/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Max upload size (documents, images)
    client_max_body_size 25M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN"          always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy "strict-origin"        always;
    add_header X-XSS-Protection "1; mode=block"       always;

    # ── Frontend SPA ───────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Backend REST API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── OAuth2 authorization redirect ─────────────────────────────────────────
    location /oauth2/ {
        proxy_pass         http://backend:8080/oauth2/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── OAuth2 callback ───────────────────────────────────────────────────────
    location /login/oauth2/ {
        proxy_pass         http://backend:8080/login/oauth2/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── MinIO S3 (strip /minio prefix, mirroring vite proxy rule) ─────────────
    location /minio/ {
        proxy_pass         http://minio:9000/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        client_max_body_size 25M;
    }
}
