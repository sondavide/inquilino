apiVersion: 1

groups:
  # ── Prometheus: host & container metrics ────────────────────────────────────
  - orgId: 1
    name: Infrastructure
    folder: Alerts
    interval: 1m
    rules:

      - uid: alert-cpu-high
        title: High CPU Usage
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: '100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [85]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: High CPU usage on host
          description: 'CPU usage is above 85% for more than 5 minutes.'
        labels:
          severity: warning
        isPaused: false

      - uid: alert-memory-high
        title: High Memory Usage
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: '(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: High memory usage on host
          description: 'Memory usage is above 90% for more than 5 minutes.'
        labels:
          severity: warning
        isPaused: false

      - uid: alert-disk-high
        title: High Disk Usage
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'max((1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs",mountpoint!~"/boot.*|/sys.*|/run.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs",mountpoint!~"/boot.*|/sys.*|/run.*"}) * 100)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 0s
        annotations:
          summary: High disk usage on host
          description: 'Disk usage is above 90% on one or more filesystems.'
        labels:
          severity: critical
        isPaused: false

      - uid: alert-container-down
        title: Container Down
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 180
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: '(time() - container_last_seen{name=~"inquilino-backend|inquilino-postgres|inquilino-nginx|inquilino-minio",image!=""})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 180
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [120]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 0s
        annotations:
          summary: 'Container {{ $labels.name }} is down'
          description: 'Container {{ $labels.name }} has not been seen by cAdvisor for more than 2 minutes.'
        labels:
          severity: critical
        isPaused: false

  # ── Loki: application log patterns ──────────────────────────────────────────
  - orgId: 1
    name: Application
    folder: Alerts
    interval: 1m
    rules:

      - uid: alert-nginx-503
        title: Nginx 503 Errors
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({container_name="inquilino-nginx"} |= " 503 " [5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Nginx 503 errors detected
          description: 'One or more 503 responses detected in Nginx logs in the last 5 minutes.'
        labels:
          severity: critical
        isPaused: false

      - uid: alert-postgres-unreachable
        title: PostgreSQL Unreachable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({container_name="inquilino-backend"} |~ "(?i)(ERROR|WARN|FATAL)" |~ "(?i)(postgres.*(exception|timeout|unavailable|unreachable|refused|failed))|(cannot connect.*postgres|connection.*refused)" [5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [3]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: PostgreSQL unreachable from backend
          description: 'PostgreSQL connection errors detected in backend logs in the last 5 minutes.'
        labels:
          severity: critical
        isPaused: false
