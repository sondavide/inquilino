name: Build & Push Frontend

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (es. 1.0.0 — default: latest)'
        required: false
        default: 'latest'

jobs:
  build:
    name: Build Docker image → ghcr.io
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./inquilino-frontend
          file: ./inquilino-frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/sondavide/inquilino-frontend:${{ inputs.tag }}
            ghcr.io/sondavide/inquilino-frontend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
